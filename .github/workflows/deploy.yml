name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/core.js
          node --check js/drawing.js
          node --check js/editor.js
          node --check js/screens-home.js
          node --check js/screens-editor.js
          node --check js/io.js
          node --check js/v02.js
          node --check js/v03.js
          node --check js/v04.js
          node --check js/v05.js
          node --check js/v06.js
          node --check js/v07.js
          node --check js/main.js
          node --check sw.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
