name: Import v0.8 bundled atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v08-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download bundled atlas
        run: |
          mkdir -p assets/generated
          curl -L --fail --retry 3 'https://at.adobe.com/jRRAIY9lkYX86llZ' -o assets/generated/user-assets-v08.webp
          echo '105678fa3a762600de4f14f966bcb43c5481fb8f15833f55923068f86ed9418e  assets/generated/user-assets-v08.webp' | sha256sum -c -
      - name: Commit atlas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/user-assets-v08.webp
          git commit -m 'assets: import v0.8 illustrated atlas'
          git push
